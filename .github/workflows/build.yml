name: Build IPA

# 在 GitHub 的 macOS runner 上编译，你不需要自己有 Mac。
# 产物是一个未签名的 .ipa，用 AltStore / SideStore 装到手机上。

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    # macos-15 自带 Xcode 16，能打开 XcodeGen 生成的工程（格式 77）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate --spec project.yml 2>&1 | tee /tmp/xcodegen.log
          test -d Vaillant.xcodeproj || { echo "::error::XcodeGen 未生成工程"; cat /tmp/xcodegen.log; exit 1; }

      - name: 确认 Xcode 版本
        run: xcodebuild -version

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Vaillant.xcodeproj \
            -scheme Vaillant \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee /tmp/build.log | grep -E "error:|warning:|BUILD" || true
          echo "---- 完整日志已存 /tmp/build.log ----"
          tail -40 /tmp/build.log

      - name: 打包 .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Vaillant.app Payload/
          zip -qry Vaillant.ipa Payload
          rm -rf Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Vaillant-ipa
          path: Vaillant.ipa
          retention-days: 30

# 注意：macOS runner 的免费额度对公开仓库每月 2000 分钟，私有仓库不计入免费额度。
# 如果是私有仓库，macOS runner 会按分钟计费。用 Codemagic 免费额度可避开这点。
