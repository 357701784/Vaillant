name: Build IPA

# 在 GitHub 的 macOS runner 上编译，你不需要自己有 Mac。
# 产物是一个未签名的 .ipa，用 AltStore / SideStore 装到手机上。

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    # macos-15 自带 Xcode 16，能打开 XcodeGen 生成的工程（格式 77）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate --spec project.yml 2>&1 | tee /tmp/xcodegen.log
          test -d Vaillant.xcodeproj || { echo "::error::XcodeGen 未生成工程"; cat /tmp/xcodegen.log; exit 1; }

      - name: 确认 Xcode 版本
        run: xcodebuild -version

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Vaillant.xcodeproj \
            -scheme Vaillant \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build > /tmp/build.log 2>&1 || {
              echo "### 编译失败，以下是错误行 ###"
              grep -E "error:|error " /tmp/build.log | head -40 || true
              echo "### 最后 40 行 ###"
              tail -40 /tmp/build.log
              exit 1
            }
          echo "编译成功"
          grep -E "warning:" /tmp/build.log | head -20 || echo "无警告"

      - name: 打包 .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/Vaillant.app
          echo "### 查找产物 ###"
          find build/Build/Products -maxdepth 2 -name "*.app" 2>/dev/null || echo "没有找到 .app"
          if [ ! -d "$APP" ]; then
            echo "::error::未找到 $APP"
            find build -maxdepth 4 -type d -name "*.app" 2>/dev/null | head
            exit 1
          fi
          rm -rf Payload Vaillant.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Vaillant.ipa Payload
          rm -rf Payload
          SIZE=$(stat -f%z Vaillant.ipa)
          echo "### ipa 大小: $SIZE 字节 ###"
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::ipa 体积异常小（$SIZE 字节），打包有问题"
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Vaillant-ipa
          path: Vaillant.ipa
          retention-days: 30

# 注意：macOS runner 的免费额度对公开仓库每月 2000 分钟，私有仓库不计入免费额度。
# 如果是私有仓库，macOS runner 会按分钟计费。用 Codemagic 免费额度可避开这点。
