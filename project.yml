name: Vaillant
options:
  bundleIdPrefix: cn.vaillant.selfuse
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Xcode 16 写出的工程格式（77）需要 Xcode 16+ 才能打开。
  # 显式锁定，避免 CI 的 Xcode 版本变动导致工程打不开。
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Vaillant:
    type: application
    platform: iOS
    sources:
      - Sources/Vaillant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.vaillant.selfuse.app
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Resources/Info.plist
