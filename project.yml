name: Vaillant
options:
  bundleIdPrefix: cn.vaillant.selfuse
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # XcodeGen 默认写 xcode16_0 格式（objectVersion 77），需要 Xcode 16+。
  # 显式锁定，避免 CI 的 Xcode 版本变动导致工程打不开。
  projectFormat: xcode15_0

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Vaillant:
    type: application
    platform: iOS
    sources:
      - Sources/Vaillant
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.vaillant.selfuse.app
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 不设 ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME：
        # 一旦指定，工具栏按钮等系统控件就会用这个颜色着色（会变成橙色），
        # 不指定则沿用系统默认的蓝色。
        # 不签名编译，产物装到手机前由 AltStore/SideStore 重签
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""

# 注意：这里刻意【不】使用 XcodeGen 的 `info:` 块。
# 该块会让 XcodeGen 每次生成工程时重新生成 Resources/Info.plist，
# 覆盖掉手写版本 —— 导致 CFBundleDisplayName、UILaunchScreen、
# 屏幕方向等键全部丢失（App 在主屏显示成 "Vaillant" 而非「威能」）。
# 现在改为由 INFOPLIST_FILE + GENERATE_INFOPLIST_FILE=NO 直接引用手写文件。
